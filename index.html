
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCL LIVE Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101114;color:white;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{width:100%;max-width:390px;background:#1d1f24;padding:28px;border-radius:16px;border:1px solid #383a40}
.logo{text-align:center;color:#ff2525;font-size:28px;font-weight:bold}
h2{text-align:center;margin:10px 0 5px}
p{text-align:center;color:#aaa;font-size:14px}
input,button{width:100%;padding:14px;margin-top:14px;border-radius:8px;font-size:16px}
input{background:#111318;color:white;border:1px solid #555}
button{background:#e10600;color:white;border:0;font-weight:bold}
#message{color:#ffb5b5;text-align:center;margin-top:15px}
#dashboard{display:none;text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="logo">PCL LIVE</div>
  <p>PATJORI CRICKET LEAGUE</p>
  <div id="login">
    <h2>Admin Login</h2>
    <input id="email" type="email" placeholder="Admin Email">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn">LOGIN</button>
    <div id="message"></div>
  </div>
  <div id="dashboard">
    <h2>Welcome Admin!</h2>
    <p>आपका Login सफल हुआ है।</p>
    <button id="logoutBtn">LOGOUT</button>
  </div>
</div>

<script type="module">
import {initializeApp} from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut}
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBSDKTq4r-z7XbHpkCkzwc5bkD-IvFokEY",
  authDomain: "pcl-live-b6221.firebaseapp.com",
  databaseURL: "https://pcl-live-b6221-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "pcl-live-b6221",
  storageBucket: "pcl-live-b6221.firebasestorage.app",
  messagingSenderId: "569868359276",
  appId: "1:569868359276:web:4cea96b5d8447871352a49"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const login = document.getElementById("login");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");

document.getElementById("loginBtn").onclick = async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  message.textContent = "Please wait...";
  try {
    await signInWithEmailAndPassword(auth,email,password);
    login.style.display = "none";
    dashboard.style.display = "block";
  } catch(error) {
    message.textContent = "Login failed: " + error.message;
  }
};

document.getElementById("logoutBtn").onclick = async () => {
  await signOut(auth);
  dashboard.style.display = "none";
  login.style.display = "block";
  message.textContent = "";
};
</script>
</body>
</html>
