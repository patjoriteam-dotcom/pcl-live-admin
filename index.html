
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCL LIVE Admin</title>
<style>
body{margin:0;background:#101522;color:white;font-family:Arial,sans-serif;padding:18px}
.container{max-width:600px;margin:auto}
h1{color:#ff3030;text-align:center}
.card{background:#202a3b;padding:18px;border-radius:12px;margin:15px 0}
input,select,button{width:100%;padding:13px;margin:8px 0;box-sizing:border-box;border:0;border-radius:7px;font-size:16px}
button{background:#e10600;color:white;font-weight:bold}
.secondary{background:#475569}
.match{background:#303c50;padding:12px;border-radius:8px;margin:10px 0}
.hidden{display:none}
small{color:#cbd5e1}
</style>
</head>
<body>
<div class="container">
<h1>🏏 PCL LIVE ADMIN</h1>

<div id="loginBox" class="card">
<h3>Admin Login</h3>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">LOGIN</button>
<p id="loginMsg"></p>
</div>

<div id="dashboard" class="hidden">
<div class="card">
<h2>Welcome Admin!</h2>
<button class="secondary" id="logoutBtn">LOGOUT</button>
</div>

<div class="card">
<h3>➕ नया मैच बनाएँ</h3>

<input id="matchName" placeholder="Match Name (जैसे PCL Final)">
<select id="team1"></select>
<select id="team2"></select>
<input id="matchDate" type="date">

<h3>Toss</h3>
<select id="tossWinner">
<option value="">Toss Winner चुनें</option>
</select>
<select id="decision">
<option value="">पहले क्या करेंगे?</option>
<option value="Batting">Batting</option>
<option value="Bowling">Bowling</option>
</select>

<button id="saveMatch">SAVE MATCH</button>
<p id="saveMsg"></p>
</div>

<div class="card">
<h3>📋 मैच की सूची</h3>
<div id="matchList">मैच लोड हो रहे हैं...</div>
</div>
</div>
</div>

<script type="module">
import {initializeApp} from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
getAuth, signInWithEmailAndPassword, signOut,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

import {
getDatabase, ref, push, set, onValue
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

// अपनी Firebase Config यहाँ डालें
const firebaseConfig = {
apiKey: "AIzaSyBSDKTq4r-z7XbHpkCkzwc5bkD-IvFokEY",
authDomain: "pcl-live-b6221.firebaseapp.com",
databaseURL: "https://pcl-live-b6221-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "pcl-live-b6221",
storageBucket: "pcl-live-b6221.firebasestorage.app",
messagingSenderId: "569868359276",
appId: "1:569868359276:web:4cea96b5d8447871352a49"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const teams = [
"Patjori Warriors",
"Mithapur Kings",
"Star Eleven",
"Royal Tigers",
"Super Strikers",
"Rising Lions",
"Thunder Boys",
"Dynamic XI",
"Power Hitters",
"Master Blasters",
"Young Champs",
"Fire Fighters"
];

const team1 = document.getElementById("team1");
const team2 = document.getElementById("team2");
const tossWinner = document.getElementById("tossWinner");

teams.forEach(team => {
team1.add(new Option(team,team));
team2.add(new Option(team,team));
tossWinner.add(new Option(team,team));
});

const loginBox = document.getElementById("loginBox");
const dashboard = document.getElementById("dashboard");
const loginMsg = document.getElementById("loginMsg");

document.getElementById("loginBtn").onclick = async () => {
loginMsg.textContent = "Login हो रहा है...";
try {
await signInWithEmailAndPassword(
auth,
document.getElementById("email").value,
document.getElementById("password").value
);
} catch(error) {
loginMsg.textContent = "Login Error: " + error.message;
}
};

onAuthStateChanged(auth, user => {
if(user) {
loginBox.classList.add("hidden");
dashboard.classList.remove("hidden");
loadMatches();
} else {
dashboard.classList.add("hidden");
loginBox.classList.remove("hidden");
}
});

document.getElementById("logoutBtn").onclick = () => signOut(auth);

document.getElementById("saveMatch").onclick = async () => {
const user = auth.currentUser;
if(!user) return;

const name = document.getElementById("matchName").value.trim();
const a = team1.value;
const b = team2.value;
const date = document.getElementById("matchDate").value;
const toss = tossWinner.value;
const decision = document.getElementById("decision").value;
const msg = document.getElementById("saveMsg");

if(!name || !date || !toss || !decision) {
msg.textContent = "सभी जानकारी भरें।";
return;
}

if(a === b) {
msg.textContent = "दो अलग-अलग टीमें चुनें।";
return;
}

msg.textContent = "मैच सेव हो रहा है...";

const battingFirst = decision === "Batting" ? toss :
(toss === a ? b : a);

const match = {
matchName: name,
team1: a,
team2: b,
matchDate: date,
tossWinner: toss,
tossDecision: decision,
battingFirst: battingFirst,
status: "Upcoming",
createdAt: Date.now(),
createdBy: user.uid
};

try {
const newMatch = push(ref(db,"matches"));
await set(newMatch,match);
msg.textContent = "मैच सफलतापूर्वक सेव हो गया! ✅";

document.getElementById("matchName").value = "";
document.getElementById("matchDate").value = "";
tossWinner.value = "";
document.getElementById("decision").value = "";
} catch(error) {
msg.textContent = "सेव नहीं हुआ: " + error.message;
}
};

function loadMatches() {
onValue(ref(db,"matches"), snapshot => {
const list = document.getElementById("matchList");
list.innerHTML = "";

if(!snapshot.exists()) {
list.textContent = "अभी कोई मैच नहीं बनाया गया है।";
return;
}

snapshot.forEach(child => {
const m = child.val();
const div = document.createElement("div");
div.className = "match";

const heading = document.createElement("b");
heading.textContent = m.matchName || "Match";

const details = document.createElement("p");
details.textContent =
(m.team1 || "") + " VS " + (m.team2 || "") +
" | " + (m.matchDate || "");

const status = document.createElement("small");
status.textContent =
"Toss: " + (m.tossWinner || "") +
" | पहले Batting: " + (m.battingFirst || "");

div.append(heading,details,status);
list.appendChild(div);
});
}, error => {
document.getElementById("matchList").textContent =
"डेटा लोड नहीं हुआ: " + error.message;
});
}
</script>
</body>
</html>
